name: Deno

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # One gate, so CI and a local run cannot disagree about what passing
      # means. They used to: CI ran the tests but never type-checked, and
      # `deno task check` type-checked but never ran the tests, so the suite
      # was invisible locally and got declared nonexistent.
      - name: Check
        run: deno task check

