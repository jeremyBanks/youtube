name: Scan Dropout

# Records what exists on watch.dropout.tv, YouTube-scan style: the sitemap
# gives existence and deletion detection in one request, then a budget of
# page fetches (12 seconds apart) fills in details, once ever per page.
#
# Two layers, cheapest first. Collections (~196 pages) carry each show's
# display name and synopsis, so they finish in a run or two and immediately
# make every episode nameable. Episodes (~3,600 pages) carry the official
# release date, which is the reason this scan exists. Both draw on one
# shared budget, so a run's length is bounded by that number alone.
#
# The backlog only shrinks. Curation stays manual; this only updates data/.
# The pages are public, so no secrets are needed.
on:
  schedule:
    # Daily at 11:41 UTC, half an hour after the YouTube scan. The gap is
    # not about load — these runs are minutes long and write different
    # files — but about the push: both commit to trunk, and the loser of a
    # race would be rejected as non-fast-forward. Off-the-hour minute to
    # dodge GitHub's :00 congestion.
    - cron: "41 11 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Pages to fetch (default: config/dropout.toml)"
        required: false
        type: string

# Never let two runs write data/ at once. A separate group from the YouTube
# scan: they touch disjoint files, so they may overlap each other freely.
# Shares a group with the channel scan on purpose. Both commit to trunk with
# a plain push, so two runs overlapping means the loser is rejected as a
# non-fast-forward and its capture is thrown away. Serialising them makes that
# impossible rather than merely unlikely: the schedules are half an hour apart,
# but GitHub has been firing them hours late, and nothing preserves the gap.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan-dropout:
    runs-on: ubuntu-latest
    # A run is only a few minutes at the configured budget; the limit exists
    # to stop a hang eating a runner, not to accommodate normal work.
    timeout-minutes: 64

    permissions:
      contents: write

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The budget comes from config/dropout.toml and is deliberately small:
      # a daily nibble finishing in about four minutes, not an hour-long
      # crawl. A manual dispatch can pass a larger one to bulk backfill.
      #
      # The timeout is step-level rather than only job-level. A job-level
      # timeout cancels the job outright, so the commit below never runs and
      # every page fetched is thrown away; ending the step instead leaves
      # room to save the work.
      - name: Scan
        timeout-minutes: 48
        env:
          # Via the environment rather than interpolated into the command,
          # so the input cannot be read as shell.
          BUDGET: ${{ inputs.budget }}
        run: |
          if [ -n "$BUDGET" ]; then
            deno task scan-dropout --budget="$BUDGET"
          else
            deno task scan-dropout
          fi

      # Always, even when the scan failed or was cut off. The scanner writes
      # as it goes and flushes on the way out, and every page it did fetch
      # is a page nobody has to fetch again. A failed run still reports
      # failure; it just does not also discard its work.
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Scan Dropout for new, removed, and detailed episodes"
            # Another job may have landed a commit while this one was
            # scanning. Rebase and retry rather than discarding the capture:
            # the two scans write disjoint files, so a rebase applies cleanly,
            # and a lost race otherwise costs the whole run's work.
            for attempt in 1 2 3; do
              git push && break
              echo "Push rejected; rebasing onto trunk (attempt $attempt)."
              git pull --rebase origin trunk
            done
          fi
