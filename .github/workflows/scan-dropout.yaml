name: Scan Dropout

# Records what exists on watch.dropout.tv, YouTube-scan style: the sitemap
# gives existence and deletion detection in one request, and a budget of
# episode-page fetches (12 seconds apart) fills in release dates, once ever
# per episode. The backlog only shrinks; at the default budget the full back
# catalogue converges in ~24 runs. Curation stays manual; this only updates
# data/. The pages are public, so no secrets are needed.
on:
  schedule:
    # Weekly, Sunday 08:37 UTC, about two hours after the YouTube scan, so
    # the pair lands together in the middle of the weekend and leaves one
    # week's changes in one place. The gap is generous: this run takes ~35
    # minutes at 12-second delays, and the two write different files, so
    # overlapping would be harmless anyway. Off-the-hour minute to dodge
    # GitHub's :00 congestion.
    - cron: "37 8 * * 0"
  workflow_dispatch:

# Never let two runs write data/ at once. A separate group from the YouTube
# scan: they touch disjoint files, so they may overlap each other freely.
concurrency:
  group: scan-dropout
  cancel-in-progress: false

jobs:
  scan-dropout:
    runs-on: ubuntu-latest
    # The budgeted run takes ~35 minutes at 12-second politeness delays;
    # leave slack without letting a hang eat a runner for hours.
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Scan
        run: deno task scan-dropout

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Scan Dropout for new, removed, and detailed episodes"
            git push
          fi
