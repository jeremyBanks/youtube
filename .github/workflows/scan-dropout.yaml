name: Scan Dropout

# Records what exists on watch.dropout.tv, YouTube-scan style: the sitemap
# gives existence and deletion detection in one request, then a budget of
# page fetches (12 seconds apart) fills in details, once ever per page.
#
# Two layers, cheapest first. Collections (~196 pages) carry each show's
# display name and synopsis, so they finish in a run or two and immediately
# make every episode nameable. Episodes (~3,600 pages) carry the official
# release date, which is the reason this scan exists. Both draw on one
# shared budget, so a run's length is bounded by that number alone.
#
# The backlog only shrinks. Curation stays manual; this only updates data/.
# The pages are public, so no secrets are needed.
on:
  schedule:
    # Weekly, Sunday 08:37 UTC, about two hours after the YouTube scan, so
    # the pair lands together in the middle of the weekend and leaves one
    # week's changes in one place. The gap is generous: this run takes ~35
    # minutes at 12-second delays, and the two write different files, so
    # overlapping would be harmless anyway. Off-the-hour minute to dodge
    # GitHub's :00 congestion.
    - cron: "37 8 * * 0"
  workflow_dispatch:

# Never let two runs write data/ at once. A separate group from the YouTube
# scan: they touch disjoint files, so they may overlap each other freely.
concurrency:
  group: scan-dropout
  cancel-in-progress: false

jobs:
  scan-dropout:
    runs-on: ubuntu-latest
    # A full budget costs 300 * 12s = 60 minutes of deliberate waiting, so
    # the limit is generous enough to absorb a slow run without letting a
    # hang eat a runner for hours.
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Budget 300 rather than the config default of 150: a run is almost
      # entirely sleep, so a bigger bite costs a runner little and halves the
      # weeks needed to work through the back catalogue.
      # Cut the scan off well inside the job's own limit. A job-level
      # timeout cancels the job outright and the commit below never runs,
      # throwing away an hour of deliberate waiting; a step-level one just
      # ends the step and leaves room to save what was already fetched.
      - name: Scan
        timeout-minutes: 75
        run: deno task scan-dropout --budget=300

      # Always, even when the scan failed or was cut off. The scanner writes
      # as it goes and flushes on the way out, and every page it did fetch
      # is a page nobody has to fetch again. A failed run still reports
      # failure; it just does not also discard its work.
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Scan Dropout for new, removed, and detailed episodes"
            git push
          fi
