name: Scan

# Records what exists on the channels we follow. The point is capture: a video
# that is posted and pulled between scans leaves no trace, and no later scan can
# recover it. Curation stays manual; this only updates data/.
on:
  schedule:
    # Daily at 11:13 UTC, the small hours in North America (3:13am PST,
    # 4:13am PDT) when nothing is being published. An off-the-hour minute
    # avoids the congestion GitHub sees at :00, where scheduled jobs can be
    # delayed or dropped. The Dropout scan follows half an hour later: both
    # push to trunk, and a simultaneous second push would be rejected.
    - cron: "13 11 * * *"
  workflow_dispatch:

# Never let two scans write data/ at once. The Dropout scan shares this group.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 64

    permissions:
      contents: write

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # First, because it is cheap (~300 units against a 10,000-unit daily
      # quota) and because it sees what nothing else can: a private,
      # unlisted or foreign video appears in no uploads playlist, so the
      # channel scan below cannot know it exists. Were the order reversed,
      # a day where the channel scan exhausted the quota would capture no
      # playlists at all.
      - name: Scan playlists
        timeout-minutes: 10
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: deno task scan-playlists

      # Deliberately not --incremental-only: that flag is a manual catch-up
      # tool, and here it would suppress the complete scans that
      # config/scan.toml schedules, which are what detect deletions.
      # Step-level, so that a scan cut short still reaches the commit below.
      # A job-level timeout would cancel the job and discard the capture.
      # always(), so that a failed playlist scan does not skip this one.
      - name: Scan
        if: always()
        timeout-minutes: 48
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: deno task scan

      # Always, even on failure: a video that was posted and pulled between
      # scans cannot be recovered later, so whatever this run did see is
      # worth keeping regardless of how it ended.
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Scan channels and playlists for new and removed videos"
            # Another job may have landed a commit while this one was
            # scanning. Rebase and retry rather than discarding the capture:
            # the two scans write disjoint files, so a rebase applies cleanly,
            # and a lost race otherwise costs the whole run's work.
            for attempt in 1 2 3; do
              git push && break
              echo "Push rejected; rebasing onto trunk (attempt $attempt)."
              git pull --rebase origin trunk
            done
          fi
