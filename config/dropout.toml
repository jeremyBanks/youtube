# Politeness settings for the watch.dropout.tv scan. The pages are dynamic and
# uncached (cf-cache-status: DYNAMIC), so every request costs origin work:
# stay slow. robots.txt allows crawling.
delay-seconds = 12

# How many episode-detail pages one run may fetch. The sitemap pass itself is
# a single request. Release dates are immutable, so detail pages are fetched
# once ever per episode and the backlog only shrinks.
budget = 150

# Collection-slug prefixes whose episode details are fetched first. These
# cover the entries whose curated dates are known to be suspect.
priority = [
  "dimension-20",
  "game-changer",
  "um-actually",
  "make-some-noise",
  "very-important-people",
]

# Curation show name -> collection-slug prefix on watch.dropout.tv, used by
# verify-dates to match curation entries to scraped episodes. Best-effort and
# extendable; shows without an entry fall back to unmatched.
[shows]
"Dimension 20" = "dimension-20"
"Adventuring Party" = "dimension-20-s-adventuring-party"
"Adventuring Academy" = "adventuring-academy"
"Game Changer" = "game-changer"
"Game Changer Animated" = "game-changer-animated"
"Dimension 20 Animated" = "dimension-20-animated"
"Um, Actually" = "um-actually"
"Make Some Noise" = "make-some-noise"
"Very Important People" = "very-important-people"
"Smartypants" = "smartypants"
"Breaking News" = "breaking-news-no-laugh-newsroom"
"Dirty Laundry" = "dirty-laundry"
"Parlor Room" = "parlor-room"
"Crowd Control" = "crowd-control"
"Gastronauts" = "gastronauts"
"Thousandaires" = "thousandaires"
"Nobody Asked" = "nobody-asked"
"Play It By Ear" = "play-it-by-ear"
"Monét's Slumber Party" = "monet-s-slumber-party"
"Fatal Decision" = "fatal-decision"
"Don't Hug Me I'm Scared" = "don-t-hug-me-i-m-scared"
"The Don Hertzfeldt Collection" = "the-don-hertzfeldt-collection"
