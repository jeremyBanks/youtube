# Politeness settings for the watch.dropout.tv scan. The pages are dynamic and
# uncached (cf-cache-status: DYNAMIC), so every request costs origin work:
# stay slow. robots.txt allows crawling.
delay-seconds = 12

# How many episode-detail pages one run may fetch. The sitemap pass itself is
# a single request. Release dates are immutable, so detail pages are fetched
# once ever per episode and the backlog only shrinks.
budget = 32

# Collection-slug prefixes whose episode details are fetched first. These
# cover the entries whose curated dates are known to be suspect.
priority = [
  "dimension-20",
  "game-changer",
  "um-actually",
  "make-some-noise",
  "very-important-people",
  # A Dimension 20 campaign that Dropout files outside the dimension-20
  # prefix, so it needs naming explicitly to share D20's priority.
  "mice-murder",
]

# Curation show name -> collection-slug prefix(es) on watch.dropout.tv, used
# by verify-dates to match curation entries to scraped episodes.
#
# Only the exceptions live here. Most shows name themselves: their collection
# on Dropout carries the same display name as the curation, so the mapping is
# derived from data/dropout-collections.yaml and needs no entry. What remains
# is what cannot derive - a show whose name differs from its collection's, or
# one with no collection of its own. An entry here always wins.
[shows]
# The campaigns live under their own slugs rather than one Dimension 20
# collection, and the collection actually named "Dimension 20" is the
# complete-series aggregate, which is never a home.
"Dimension 20" = [
  "dimension-20",
  "mice-murder",
  "the-legendary-rick-perry-and-the-art-of-dimension-20",
]
# Dropout calls it "Dimension 20's Adventuring Party"; we do not.
"Adventuring Party" = "dimension-20-s-adventuring-party"
# No collection of its own at all: each stand-up special is its own
# collection, holding both the special and its "Get Your Act Together"
# companion.
"Dropout Presents" = [
  "adam-conover-unmedicated",
  "aparna-nancherla-hopeful-potato",
  "bigger-with-brennan-and-izzy",
  "cameron-esposito-four-pills",
  "chris-grace-as-scarlett-johansson",
  "courtney-pauroso-vanessa-5000",
  "demi-adejuyigbe-is-going-to-do-one-1-backflip",
  "from-ally-to-zacky",
  "hank-green-pissing-out-cancer",
  "mark-vigeant-the-best-man-show",
  "michael-cruz-kayne-sorry-for-your-loss",
  "the-big-team",
]

# A show whose runs live under more than one collection. Without these the
# linker cannot see past the first, so the web series and the renamed
# continuations read as uncurated shows of their own.
#
# Deliberately NOT here: the `game-changer` collection, which several of these
# shows link one crossover episode into, and the shared `trailers` collection.
# Mapping either would pull a whole foreign catalogue into the show's scope and
# report all of it as missing.
"Erotic Book Club" = ["erotic-book-club", "erotic-clubhouse"]
"See Plum Run" = ["see-plum-run", "precious-plum"]
"Troopers" = ["troopers-1", "troopers-the-web-series", "troopers-animated"]
"Ultramechatron Team Go!" = [
  "ultramechatron-team-go-1",
  "ultramechatron-team-go-the-web-series",
]

# Episode slug -> release date, where watch.dropout.tv's own date is wrong or
# absent and no other catalogue we hold has the show.
# `verify-dates` uses these in place of the scraped date, so the curation can
# carry the right date without being reported as a mismatch every run. Each
# needs the evidence written beside it; dates.md explains the kinds of error.
[release-dates]
# Dropout gives it 2026-09-08, the same day as episode 13. Toonout runs
# fortnightly (08-11, 08-25, 09-08), YouTube published 14 on 09-22, and
# that is the next slot.
"young-spencer-goes-to-school" = "2026-09-22"
# Dropout files the Simpsons special at 02-22 and Zelda at 05-02, two slots
# swapped on a fortnightly Saturday run. IMDb (04-17) and TVDB (04-18) put
# the Simpsons special in April, which leaves Zelda the 04-04 slot and 308
# the 05-02 one.
"zelda-aquaman-neopets" = "2020-04-04"
"d-oh-actually-a-special-simpsons-episode" = "2020-04-18"
# Dropout gives it 02-19, a Tuesday off the season's fortnightly Wednesday
# run; TVDB and the free upload both say 03-06.
"being-the-mean-gm-with-noah-diamond" = "2019-03-06"
# The page Dropout re-created on 2026-10-21, replacing
# what-is-the-worst-tattoo-to-get-1, is the only one in the season with a
# date, and it is a Wednesday. TVDB and TVmaze put all 15 episodes on
# consecutive Thursdays from 03-07, TVmaze at 09:00 Pacific, this one at 04-11.
"what-is-the-worst-tattoo-to-get" = "2019-04-11"
# See Plum Run's pages carry no dates and TheTVDB has no table for it. TVmaze
# and TMDB agree: episode 1 on Dropout's launch day, 2018-09-26, which is
# where Wikipedia's list of Dropout originals starts it, then weekly Mondays
# to 11-19, where it ends it. TVmaze stamps them 09:00 Pacific. The curation
# had episode 1 at its free upload and the rest at the 2019 members backfill.
"dt-see-plum-run-101" = "2018-09-26"
"we-want-dessert" = "2018-10-01"
"don-t-make-me-move" = "2018-10-08"
"the-cock-hog" = "2018-10-15"
"the-rumor-mill" = "2018-10-22"
"the-belly-button-ring" = "2018-10-29"
"dirty-talk" = "2018-11-05"
"the-kennedy-conspiracy" = "2018-11-12"
"busted" = "2018-11-19"
