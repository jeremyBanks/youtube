# Politeness settings for the watch.dropout.tv scan. The pages are dynamic and
# uncached (cf-cache-status: DYNAMIC), so every request costs origin work:
# stay slow. robots.txt allows crawling.
delay-seconds = 12

# How many episode-detail pages one run may fetch. The sitemap pass itself is
# a single request. Release dates are immutable, so detail pages are fetched
# once ever per episode and the backlog only shrinks.
budget = 64

# Collection-slug prefixes whose episode details are fetched first. These
# cover the entries whose curated dates are known to be suspect.
priority = [
  "dimension-20",
  "game-changer",
  "um-actually",
  "make-some-noise",
  "very-important-people",
  # A Dimension 20 campaign that Dropout files outside the dimension-20
  # prefix, so it needs naming explicitly to share D20's priority.
  "mice-murder",
]

# Curation show name -> collection-slug prefix(es) on watch.dropout.tv, used
# by verify-dates to match curation entries to scraped episodes.
#
# Only the exceptions live here. Most shows name themselves: their collection
# on Dropout carries the same display name as the curation, so the mapping is
# derived from data/dropout-collections.yaml and needs no entry. What remains
# is what cannot derive - a show whose name differs from its collection's, or
# one with no collection of its own. An entry here always wins.
[shows]
# The campaigns live under their own slugs rather than one Dimension 20
# collection, and the collection actually named "Dimension 20" is the
# complete-series aggregate, which is never a home.
"Dimension 20" = ["dimension-20", "mice-murder"]
# Dropout calls it "Dimension 20's Adventuring Party"; we do not.
"Adventuring Party" = "dimension-20-s-adventuring-party"
# No collection of its own at all: each stand-up special is its own
# collection, holding both the special and its "Get Your Act Together"
# companion.
"Dropout Presents" = [
  "adam-conover-unmedicated",
  "aparna-nancherla-hopeful-potato",
  "bigger-with-brennan-and-izzy",
  "cameron-esposito-four-pills",
  "chris-grace-as-scarlett-johansson",
  "courtney-pauroso-vanessa-5000",
  "demi-adejuyigbe-is-going-to-do-one-1-backflip",
  "from-ally-to-zacky",
  "hank-green-pissing-out-cancer",
  "mark-vigeant-the-best-man-show",
  "michael-cruz-kayne-sorry-for-your-loss",
  "the-big-team",
]
