  Episode eight features the game Right Of Succession, where 3 to 5 players act as noble houses and fight to gain control of the throne. The game is designed by Lowell Francis.

  For more, check out Lowell's interview here: http://www.cah.tumblr.com


  DEFINITIONS:

  Ameritrash Games
  Derogatory term for American-style board games with high emphasis on theme, conflict, and luck, such as Axis & Allies.

  Area Control or Area Influence
  The Area Control or Area of Influence mechanic typically rewards players for having the majority of units or influence in an area or region of the board.

  Bidding or Auction Mechanic
  A mechanic in which players bid on components or roles to enhance their position in the game.

  Blind Playtest
  A playtest without the designer or experienced players present, depending on the tester's ability to cold-read the rules.

  Euro Games
  Term for European-style board games which emphasize strategy and downplay luck and conflict, such as Puerto Rico.

