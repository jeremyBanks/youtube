  Link - https://darringtonpress.com/quarterpast/

  Queen by Midnight: Quarter Past is a follow-up to Darrington Press’ August 2023 release, Queen by Midnight, that can be played as a standalone expansion or as an addition to the core game. Choose a Princess to fight with in this immersive, battle-royale deck-building board game of strategy, treachery, guile, and brawn.

  For the first time, face off with as few as two players! This new standalone expansion is built to be a great introduction to Queen by Midnight and includes a ton of new options for play with the original game: 4 full new Princesses with their own strategies and a wealth of new Bazaar Cards to shake up strategies with the original.

  Overview:
  The Midnight Queen is dead….Four new challengers enter the fray for the grand contest known as the Rule by Midnight: a 24-hour trial of combat and guile in which the Princesses of Twelvefold are summoned to Court to battle one another. At the stroke of midnight, the most powerful Princess left standing will be crowned the new ruler of Twelvefold.

  Gameplay:
  Choose from 4 dynamic Princesses, each with a unique strategy and style.
  Play cards to generate Clout, which can be spent at the markets to grow your power and influence.
  As the game develops, gain access to more powerful cards from the Bazaar deck and your Princess's War Chest.
  Hedge your bets by pledging your loyalty to other players for the possibility of a shared victory!
  Eliminate other princesses through brute force or by having the most Clout and Health when the clock strikes midnight.

