  Episode four features Discount Salmon, a simple speedy card game where players compete to save the most fish from a contaminated lake. The game is designed by Cara Heacock and Marcus Ross.

  To learn more, check out their interview here: http://bit.ly/1r5DjoP
  Marcus can be reached on Twitter at @marcusross and Cara as @caraheacock.

  Check out the Start-up Weekend: http://startupweekend.org/


  DEFINITIONS:

  Filler Games
  A game intended to be played between plays of more substantial games.

  Real-time Games
  Games in which play is simultaneous rather than in turns.

  Trick-taking game
  A game in which players try to get the best card to win all the cards in a round.

  Twitch or Twitch Games
  A mechanic in which players' reaction speed and accuracy is rewarded with advancement in the game.






