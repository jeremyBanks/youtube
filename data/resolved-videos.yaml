  Episode six features the game Cool Table, where players fight for popularity in a cliquey high school cafeteria. The game is designed by Jasmine Davis.

  For more about Jasmine, check out her interview here: http://www.cah.tumblr.com
  You can reach Jasmine on Twitter at @athingforjaz.


  DEFINITIONS:

  Modular Game
  A game in which the board is decentralized into several parts that can come together in different ways.

  Metagame
  The activity or information gained outside the game that helps in the game.

  Analysis Paralysis
  The state in a game where a player is unable to decide on an action because of an overload of choices.

  Set Collection
  A goal where a player needs multiple cards of a type to succeed.

  Ebola Monkey Hunt Problem
  A problem seen in the game Ebola Monkey Hunt where all players benefit from stopping all other players from playing the game.


  Gateway Game
  A game designed to get non-gamers to become gamers.

  Acceleration Mechanic
  A mechanic that speeds the game to conclusion regardless of whether the players work to end it.



