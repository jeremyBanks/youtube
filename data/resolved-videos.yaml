  Tap can be reached at @tapofgames.


  DEFINITIONS


  Game Mechanics
  The systems by which a game functions; often contrasted with "theme," the story rationale for using those mechanics.

  Modular Game
  A game in which the board is decentralized into several parts that can come together in different ways.

  Press Your Luck
  A mechanic in which players can continue onward in the game by incurring additional risk.

  Runaway Winner
  A player who gets in the lead and can't be stopped from getting farther ahead.

  Territorial Acquisition
  A game in which the goal is to control and exploit areas of the board.

  Twitch Game
  A mechanic in which players' reaction speed and accuracy is rewarded with advancement in the game.

  Zero-Sum Game
  A game situation in which any player's gain must be exactly balanced by other players' loss.


