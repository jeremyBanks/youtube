  Episode twelve features the board game What the Flock?!, where 2 to 6 players try to flock their birds together into a tree. The game is designed by Steve Ewoldt.

  DEFINITIONS:

  Abstract Game
  A game with simple mechanics and less randomness, allowing deep strategic play.

  Analysis Paralysis
  The state in a game where a player is unable to decide on an action because of an overload of choices.

  Cascade
  An effect where one player's action triggers a series of actions which radically change the game state.

  Coordinate Grid System
  A grid with a numbered X- and Y-axis to place or move pieces, such as in the game Battleship.

  Gateway Game
  A game designed to get non-gamers to become gamers.

  Mold
  A casing in which plastic or metal pieces are minted. Often the most expensive item in a game's construction.

  Party Game
  A game expected to be played casually with not a lot of rules and lots of social interaction.

