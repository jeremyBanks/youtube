  Episode ten features Installation 42, a deck-building game where 3 to 5 players have to transport what's left of the human population to new homes somewhere in the galaxy. The game is designed by Bruce Stringer, Patrick Murphy, Heather Smith and Matt Lattanzi of Team Weasel Games.

  Learn more about the game at Installation42.com. 
  Team Weasel Games can be found on Twitter at @teamweaselgames.

  DEFINITIONS:

  Buff
  A bonus that increases a player's ability to perform actions in the game.

  Debuff
  A penalty that decreases a player's ability to perform actions in the game.

  Deckbuilding Game
  A game in which players build and optimize their decks over the course of play.

  Economy
  The management of resources inside a game.

  Game Jam
  The management of resources inside a game.

  Localization
  Preparing a game for release in different countries, allowing for changes in language, design, and artwork.

  Pentomino
  A polyomino of five squares.

  Player Elimination Game
  A game in which players can be kicked out of the game before it ends.

  "Stay Alive"
  A game in which the object is to keep at least one of your pieces when all opponents' pieces have dropped out of play.

