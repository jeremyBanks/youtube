  DEFINITIONS:

  Auction Mechanic
  A mechanic in which players bid on components or roles to enhance their position in the game.

  Edward Tufte
  Professor of information design at Yale; many designers and graphic artists in the game industry are disciples of Tufte.

  Playtest
  The process by which designers and developers test games for flaws before releasing them to market.


