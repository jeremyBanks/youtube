  Episode four features Rocket Wreckers, a 2-player card game where competitors battle each other while riding on the back of a rocketship. The game is designed by Rob Couch. 

  For more with Rob, check out his website http://www.poorlydesigned.com or read his interview here: http://bit.ly/1ns3DMx

  Rob can be reached on Twitter at @poorly_designed.


  DEFINITIONS:

  Asymmetric Game
  A game in which each player has a different set of components or abilities.

  Board "Lock Up"
  A state where the game does not advance, either because it can't or because no player has a reason to advance the game.

  Ogre Problem
  The challenge of designing two asymmetric player options and having them both have a roughly equal chance to win.

  Runaway Winner
  A player who gets in the lead and can't be stopped from getting farther ahead.



