uploadedAt:      2014-06-04T17:06:47.000Z
duration:        1007
resolvedAt:      2026-09-22T15:34:21.450Z
privacyStatus:   public
licensedContent: false
description:     |-
  Episode fifteen features the Jane Austen Card Game, a draw-and-play game where players act as characters of the Jane Austen days and try to find the best man to marry. The game is designed by Edward Castronova. He gives advice to people who want to study games in college here: http://mypage.iu.edu/~castro/students.html

  For more, check out Edward's interview here: http://cah.tumblr.com/post/87807533400/episode-fifteen-features-the-jane-austen-card


  DEFINITIONS:
  Area Control or Area Influence
  The Area Control or Area of Influence mechanic typically rewards players for having the majority of units or influence in an area or region of the board.

  Analysis Paralysis
  The state in a game where a player is unable to decide on an action because of an overload of choices.

  Chattel
  A movable article of personal property.

  Hidden Knowledge
  Information that one player has that other players do not share.

  Information Problem
  A situation where not all players have all the information needed to make the decisions the game demands.

  Ladies & Gentlemen
