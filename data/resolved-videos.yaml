  Tabletop Deathmatch is an independent tabletop game design contest hosted by Cards Against Humanity. Sixteen games enter, one wins a first printing and a booth at GenCon 2014.

  For Episode 2, our second finalist is Jupiter Deep.

  Visit http://www.tabletopdeathmatch.com for more information.

  DEFINITIONS:

  Cooperative Game
  A game in which players work as a team to beat the game, rather than trying to beat each other.

  Lose Condition
  How a game is lost, which may end the game for one player or for all of them.

  Win Condition
  How a game is won, usually ending the game.


  GAMES REFERENCED:

