  DEFINITIONS:

  Cooperative Game
  A game in which players work as a team to beat the game, rather than trying to beat each other.

  Lose Condition
  How a game is lost, which may end the game for one player or for all of them.

  Win Condition
  How a game is won, usually ending the game.


