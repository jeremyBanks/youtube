  Daggerheart is OUT NOW, which you can dive into with the Daggerheart Core Set or Daggerheart Class Packs! Plus, a thrilling expansion Daggerheart: Hope & Fear releases August 25th! Visit https://daggerheart.com to learn more. Purchase the game, expansion, and tons of accessories at friendly local game stores, Amazon, Barnes & Noble, and other bookstores, or Critical Role shops:
