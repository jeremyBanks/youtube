resolvedAt:      2026-09-20T14:42:20.617Z
privacyStatus:   public
description:     |-
  Catch Critical Role live Thursdays at 7PM PT on Twitch: https://goo.gl/D9fsrS

  Listen to the Critical Role podcast: https://goo.gl/jVwPBr

  For more G&S role-playing, watch Season 2 of LARPs! http://bit.ly/LARPS_S2

  The team overtakes the Duergar Queen, before Ulara is able to make a thrall of Grog. After slaying her underlings, and momentarily banishing her to another dimension, Vox Machina presses her for information about K’Varn. It is in that instant that K’varn speaks to them, through the lips of the Duergar queen.
  His evil palpably radiating from the queen, K’varn urges Vox Machina to find him, in the city of Yug’voril. His message delivered, the Duergar falls still, her life departed.

  To the surprise of the weary group, Keylith again voices her growing doubts about the path they all walk, but after some assuaging words from Vax’ildan, the group makes camp in order to rest their tired bones.

  Later, they proceed on, finding a vast island in yet another massive underground cavern. Clarota informs them that this is where the city of Yug’voril stands. The party finds a ruined boat beneath the surface of the subterranean lake, and after Tiberius raises it and Percy patches it up, they take to the water. Pausing at a craggy beach as they make their way on to K’Varn, the party perhaps goes looking for trouble and does indeed find it.​

