  Episode thirteen features Wizard Dodgeball, where two players use magic and spells in a game of old-fashioned dodgeball. The game is designed by Peter Newland.

  For more, check out mindthegapstudios.com.
  Peter can be reached on Twitter at @MtGSPete.

  DEFINITIONS:

  Death Spiral
  A situation where a player starts to lose and rapidly accelerates toward a loss.

  Dice Mechanic
  Using dice in a game to randomly determine the outcome of an interaction.

  Drafting
  A mechanic where players each select one or more cards then pass the opportunity to select cards around the table.

  Initiative
  A process that determines the order of the players who then act in that order.

  Orthogonal Movement
  Movement horizontally and vertically, contrasted with diagonal movement.

  Playtest
  The process by which designers and developers test games for flaws before releasing them to market.

  Turn Based Game
  Players take their turns one at a time consecutively rather than simultaneously.


