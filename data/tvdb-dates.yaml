# Release dates transcribed by hand from TheTVDB (thetvdb.com), 2026-11-03,
# for the CollegeHumor-era shows whose watch.dropout.tv pages carry no
# release date. Keyed by curated show name, then by episode title as TVDB
# gives it; `verify-dates` matches titles after normalisation and ignores a
# match more than 400 days from the curated date, which is the wrong episode.
#
# TVDB is a fan catalogue and is sometimes a day late (it tends to carry the
# UTC date of an evening Pacific release) and sometimes a placeholder (See
# Plum Run is all 2018-01-01 there, and was left out). Each table here was
# checked against the show's weekly cadence before it was adopted.
#
# A date here is used only when Dropout's own page has none. To correct a
# Dropout date that is wrong, use `[release-dates]` in config/dropout.toml.
